font_family = "Cantarell"
font_weight = 600
padding = 12
scale = 1.0000000074505806
shadow = false
start = [ "control-center", "launcher", "active_window", "group:g1" ]
thickness = 28
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    enabled = false
    fill = "on_secondary"
    id = "g1"
    members = [ "cpu", "temp", "sysmon", "sysmon_2", "sysmon_3", "ram" ]

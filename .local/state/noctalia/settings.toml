config_version = 15

[bar.default]
center = [ "workspaces" ]
end = [
    "bar",
    "tray",
    "wallhaven",
    "device_battery",
    "weather",
    "keyboard_layout",
    "network",
    "volume",
    "clock",
    "notifications"

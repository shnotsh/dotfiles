[plugins]
enabled = [
    "nomadcxx/gamer-mode",
    "noctalia/translator",
    "thaer99ob/default-apps",
    "sh/device-battery",
    "miguelfm/ai-triage",
    "noctalia/wallhaven",
    "kenn/keybind-cheatsheet"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/sh/Developer/solaar-noctalia"
    name = "device-battery-dev"

[shell]
font_family = "Cantarell"

    [shell.greeter_sync]
    auto_sync = false

    [shell.launcher]
    category_icons_only = true
    compact = true
    layout = "simple"
    pinned = [ "zen", "dev.zed.Zed", "org.godotengine.Godot", "blender", "org.kde.dolphin" ]
    show_app_actions = true
    show_icons = false

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Eldritch"
community_palette = "Mine"
custom_palette = "wallhaven-zp9rmy-mo"
